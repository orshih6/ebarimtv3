name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Pull requests only prove the image builds; nothing is pushed or tagged.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Build image
      run: docker build . --tag ebarimtv3:pr-${{ github.event.pull_request.number }}

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Get tag info
      id: taggerDryRun
      uses: anothrNick/github-tag-action@1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: false
        DRY_RUN: true

    - name: echo tag info
      run: |
        echo "The current tag is: ${{ steps.taggerDryRun.outputs.tag }}"
        echo "The next tag version will be: ${{ steps.taggerDryRun.outputs.new_tag }}"
        echo "The version increment was: ${{ steps.taggerDryRun.outputs.part }}"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      run: |
        docker build . --tag ghcr.io/orshih6/ebarimtv3:${{ steps.taggerDryRun.outputs.new_tag }}
        docker push ghcr.io/orshih6/ebarimtv3:${{ steps.taggerDryRun.outputs.new_tag }}

    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: false

    - name: send telegram message on push
      uses: appleboy/telegram-action@v1.1.1
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ${{ github.actor }} created commit:
          Commit message: ${{ github.event.head_commit.message }}

          Repository: ${{ github.repository }}

          See changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}

          Tag Version: ghcr.io/orshih6/ebarimtv3:${{ steps.taggerDryRun.outputs.new_tag }}

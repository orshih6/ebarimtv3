name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # One source tree, two images: ITC ships a separate PosService build per eBarimt
  # environment, selected by the PROD build arg. Every tag carries the variant, and
  # there is deliberately no bare `latest` — it could not say which environment the
  # image talks to.
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: staging
            prod: "false"
          - variant: prod
            prod: "true"
    steps:
      - uses: actions/checkout@v7

      # The version comes from the vendor zip filename, so dropping in a new
      # PosService_<version>-Prod.zip is the whole release step.
      - name: Read version from PosService package
        id: version
        run: |
          zip="$(ls PosService_*-Prod.zip 2>/dev/null | head -n 1)"
          if [ -z "$zip" ]; then
            echo "No PosService_<version>-Prod.zip in the repo root." >&2
            exit 1
          fi
          version="${zip#PosService_}"
          version="${version%-Prod.zip}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # sha-<commit>-<variant> is the only immutable tag: <version>-<variant> is
      # reused until the vendor zip changes, and <variant> moves on every push.
      - name: Compute image tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          {
            echo 'tags<<TAGEOF'
            echo "${image}:sha-${GITHUB_SHA}-${{ matrix.variant }}"
            echo "${image}:${{ steps.version.outputs.version }}-${{ matrix.variant }}"
            echo "${image}:${{ matrix.variant }}"
            echo 'TAGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests (including ones from forks) only prove the image builds.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PROD=${{ matrix.prod }}
          tags: ${{ steps.tags.outputs.tags }}
          # OCI metadata: GHCR shows the description on the package page and
          # links the image back to this repo. Set as both labels (docker
          # inspect) and index/manifest annotations (what GHCR reads). No
          # `licenses` key on purpose: the image mixes this repo's MIT files
          # with ITC's proprietary PosAPI, and a single SPDX id would mislead.
          labels: |
            org.opencontainers.image.title=ebarimtv3
            org.opencontainers.image.description=eBarimt 3.0 PosAPI (ITC PosService), ${{ matrix.variant }} environment
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-${{ matrix.variant }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index,manifest:org.opencontainers.image.title=ebarimtv3
            index,manifest:org.opencontainers.image.description=eBarimt 3.0 PosAPI (ITC PosService), ${{ matrix.variant }} environment
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.version=${{ steps.version.outputs.version }}-${{ matrix.variant }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
          # Scoped per variant: the two legs build different zips and would
          # evict each other's cache otherwise.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
